name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: 构建 MelonLoader Release
        shell: cmd
        run: call build.bat --MelonLoader Release

      - name: 构建 MelonLoader Debug
        shell: cmd
        run: call build.bat --MelonLoader Debug

      - name: 构建 BepInEx Release
        shell: cmd
        run: call build.bat --BepInEx Release

      - name: 构建 BepInEx Debug
        shell: cmd
        run: call build.bat --BepInEx Debug

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader_falsum-MelonLoader-Release
          path: bin/Release/InFalsusChartLoader_falsum.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader_falsum-MelonLoader-Debug
          path: bin/Debug/InFalsusChartLoader_falsum.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader_falsum-BepInEx-Release
          path: bin/BepInExRelease/InFalsusChartLoader_falsum.dll
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: InFalsusChartLoader_falsum-BepInEx-Debug
          path: bin/BepInExDebug/InFalsusChartLoader_falsum.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: InFalsusChartLoader_falsum-*

      - run: |
          for d in InFalsusChartLoader_falsum-*/; do
            zip -rjq "${d%/}.zip" "$d"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          generate_release_notes: true
